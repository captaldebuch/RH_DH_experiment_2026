import Lake
open Lake DSL

package «riemann-hypothesis» where
  version := "0.1.0"
  keywords := #["math", "riemann-hypothesis", "hardy-space", "beurling", "formal-verification"]

require mathlib from git
  "https://github.com/leanprover-community/mathlib4.git"

@[default_target]
lean_lib Beurling where
  srcDir := "proofs"

@[default_target]
lean_lib RiemannHypothesis where
  srcDir := "proofs"

@[default_target]
lean_lib NBMellinTools where
  srcDir := "proofs"
